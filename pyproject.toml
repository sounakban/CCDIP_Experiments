[project]
name = "psychdrive"
version = "0.1.0"
description = "Cognition-Conditioned Deep Inverse Planning (CCDIP): the driving environment, the subtask and subtask-selection policies, and the cognitive-profile inference used in the paper"
readme = "README.md"
requires-python = ">=3.13"
# | torch (CPU or CUDA build, chosen per machine) and pufferlib (the SP trainer's vectorised
# | environment backend) are installed separately; see README.md.
dependencies = [
    "gymnasium>=1.2.3",
    "imageio[pyav]>=2.37.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pygame>=2.6.1",
    "pytest>=9.1.1",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "tensorboard>=2.20.0",
    "tqdm>=4.67.3",
    "tyro>=1.0.9",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
# Repo uses PEP 420 namespace packages (no __init__.py). importlib mode lets pytest collect
# per-package tests/ dirs that share basenames (e.g. test_hlp_core.py in SP and SSP)
# without sys.path games or name clashes.
addopts = "--import-mode=importlib"
python_files = ["test_*.py"]
# | Parked cut files are never collected.
norecursedirs = ["to_delete", ".venv"]
